name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag-check
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.version }}" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary
        if: steps.tag-check.outputs.exists == 'false'
        run: bun run build

      - name: Create tag and GitHub Release
        if: steps.tag-check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          MAJOR="${VERSION%%.*}"
          EXTRA_ARGS=()
          if [ "$MAJOR" = "0" ]; then
            EXTRA_ARGS+=(--prerelease)
          fi
          # gh release create creates the git tag if it does not exist yet.
          gh release create "v${VERSION}" dist/tako-linux-x64 --title "v${VERSION}" --generate-notes "${EXTRA_ARGS[@]}"
