name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ matrix.asset }}
    runs-on: ubuntu-latest
    # Build inside Debian 12 so the compiled binaries carry a LOW glibc floor
    # (bookworm = glibc 2.36): a binary built on a newer distro than the target
    # server fails there with "GLIBC_x.y not found" (task 9.11, real-world
    # finding on homeserver). arm64 is cross-compiled from the same container.
    container:
      image: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64-modern
            asset: tako-linux-x64
          - target: bun-linux-arm64
            asset: tako-linux-arm64
    steps:
      - name: Install git and unzip (checkout + setup-bun requirements)
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates unzip

      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, lint and test
        run: bun run prebuild && bun run typecheck && bun run lint && bun run test

      - name: Build binary (${{ matrix.asset }})
        run: bun build src/index.tsx --compile --target=${{ matrix.target }} --outfile dist/${{ matrix.asset }}

      - name: Generate checksum sidecar
        run: sha256sum dist/${{ matrix.asset }} > dist/${{ matrix.asset }}.sha256

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
