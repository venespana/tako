name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64-modern
            asset: tako-linux-x64
          - target: bun-linux-arm64
            asset: tako-linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, lint and test
        run: bun run prebuild && bun run typecheck && bun run lint && bun run test

      - name: Build binary (${{ matrix.asset }})
        run: bun build src/index.tsx --compile --target=${{ matrix.target }} --outfile dist/${{ matrix.asset }}

      - name: Generate checksum sidecar
        run: sha256sum dist/${{ matrix.asset }} > dist/${{ matrix.asset }}.sha256

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
