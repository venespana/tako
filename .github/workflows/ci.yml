name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run lint
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run typecheck
        run: bun run typecheck

  build:
    name: Build
    needs: [test, lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tako-linux-x64
          path: dist/tako-linux-x64
          if-no-files-found: error

  version-check:
    name: Version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read base version
        id: base-version
        run: echo "version=$(git show "origin/${{ github.base_ref }}:package.json" | node -e
          "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).version)")" >>
          "$GITHUB_OUTPUT"

      - name: Read head version
        id: head-version
        run: echo "version=$(cat package.json | node -e
          "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).version)")" >>
          "$GITHUB_OUTPUT"

      - name: Compare versions
        run: |
          if [ "${{ steps.base-version.outputs.version }}" = "${{ steps.head-version.outputs.version }}" ]; then
            echo "::error::The version field in package.json was not bumped. Every PR must bump it: patch for fixes, minor for features, major for breaking changes."
            exit 1
          fi
