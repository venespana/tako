# AdGuard Home - bloqueo de publicidad + DNS local para el homelab.
# Resuelve *.homelab.internal hacia la IP del host docker (configurada en AdGuardHome.yaml).
# La admin UI NO se publica al host; se accede via Caddy como adguard.homelab.internal.
services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      # Descomenta para acceso admin directo sin pasar por Caddy (solo emergencias):
      # - "3000:3000"
    volumes:
      # Bind-mount del yaml: permite editarlo desde la UI y persistir cambios.
      - ./AdGuardHome.yaml:/opt/adguardhome/conf/AdGuardHome.yaml
      - adguard_work:/opt/adguardhome/work
    networks:
      - caddy
    labels:
      caddy: adguard.homelab.internal
      caddy.tls: internal
      caddy.reverse_proxy: "{{upstreams 3000}}"

volumes:
  adguard_work:

networks:
  caddy:
    external: true
