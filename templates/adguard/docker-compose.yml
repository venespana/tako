# AdGuard Home - ad blocking + local DNS for the homelab.
# Resolves *.homelab.internal to the docker host IP (configured in AdGuardHome.yaml).
# The admin UI is NOT published to the host; it is accessed via Caddy as adguard.homelab.internal.
services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      # Uncomment for direct admin access without going through Caddy (emergencies only):
      # - "3000:3000"
    volumes:
      # Bind-mount of the yaml: allows editing it from the UI and persisting changes.
      - ./AdGuardHome.yaml:/opt/adguardhome/conf/AdGuardHome.yaml
      - adguard_work:/opt/adguardhome/work
    networks:
      - caddy
    labels:
      caddy: adguard.homelab.internal
      caddy.tls: internal
      caddy.reverse_proxy: "{{upstreams 3000}}"

volumes:
  adguard_work:

networks:
  caddy:
    external: true
