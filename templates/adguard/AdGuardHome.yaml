# Initial AdGuard Home config.
# Edit the IP in the `dns.rewrite` section with the real docker host IP.
# This config allows AdGuard to start directly (without the full wizard);
# the first visit to https://adguard.homelab.internal will ask to create the admin.

http:
  address: 0.0.0.0:3000
  session_ttl: 720h
users: []
auth_attempts: 5
block_auth_min: 15
language: en
theme: auto

dns:
  bind_hosts:
    - 0.0.0.0
  port: 53
  protection_enabled: true
  protection_mode: default
  filtering_enabled: true
  blocked_response_ttl: 10

  # DoH upstreams (encryption against your ISP).
  upstream_dns:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  upstream_mode: load_balance
  bootstrap_dns:
    - 1.1.1.1
    - 8.8.8.8
  fallback_dns:
    - 1.1.1.1
    - 9.9.9.9

  # ====== CHANGE THIS IP to your docker host IP ======
  rewrite:
    - domain: '*.homelab.internal'
      answer: 192.168.1.10

  blocked_services:
    enabled: []

querylog:
  enabled: true
  size_memory: 1000
  interval: 168h

statistics:
  enabled: true
  interval: 1
  ignored: []

# Ad and tracker blocklists.
filters:
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
    name: AdGuard DNS filter
    id: 1
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt
    name: AdAway Default Blocklist
    id: 2

whitelist_filters: []
user_rules: []

dhcp:
  enabled: false

rlw:
  enabled: false
