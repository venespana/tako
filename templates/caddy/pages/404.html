<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Service - Homelab</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container { text-align: center; padding: 2rem; }
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }
        .message { font-size: 1.5rem; color: #a0aec0; margin-top: 1rem; }
        .submessage { font-size: 1rem; color: #718096; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <p class="message">Domain not configured</p>
        <p class="submessage">This host has no service associated in the proxy.</p>
    </div>
</body>
</html>
