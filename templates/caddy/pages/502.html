<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio caído - Homelab</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2d1b1b 0%, #3a1a1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container { text-align: center; padding: 2rem; }
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            background: linear-gradient(90deg, #f5576c, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }
        .message { font-size: 1.5rem; color: #ffb4b4; margin-top: 1rem; }
        .submessage { font-size: 1rem; color: #c89090; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">502</div>
        <p class="message">Servicio no disponible</p>
        <p class="submessage">El backend existe pero no responde. Verifica el contenedor en Portainer.</p>
    </div>
</body>
</html>
