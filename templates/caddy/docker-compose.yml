# Reverse proxy edge: Caddy with caddy-docker-proxy.
# Discovers backends by labels on the "caddy" docker network.
# TLS internal: uses its own CA persisted in ./data/caddy/pki/.
services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:ci-alpine
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ./config:/config
    networks:
      - caddy
    environment:
      - CADDY_INGRESS_NETWORKS=caddy

  # Default backend: serves a custom page for requests
  # that do not match any configured virtual host.
  fallback:
    image: nginx:alpine
    container_name: caddy-fallback
    restart: unless-stopped
    volumes:
      - ./pages:/usr/share/nginx/html:ro
      - ./nginx-fallback.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - caddy
    labels:
      caddy: ":80"
      caddy.reverse_proxy: "{{upstreams 80}}"

networks:
  caddy:
    external: true
