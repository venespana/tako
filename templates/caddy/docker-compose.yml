# Reverse proxy edge: Caddy con caddy-docker-proxy.
# Descubre backends por labels en la red docker "caddy".
# TLS internal: usa CA propia persistida en ./data/caddy/pki/.
services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:ci-alpine
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ./config:/config
    networks:
      - caddy
    environment:
      - CADDY_INGRESS_NETWORKS=caddy

  # Backend por defecto: sirve página custom para peticiones
  # que no matchean ningún virtual host configurado.
  fallback:
    image: nginx:alpine
    container_name: caddy-fallback
    restart: unless-stopped
    volumes:
      - ./pages:/usr/share/nginx/html:ro
      - ./nginx-fallback.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - caddy
    labels:
      caddy: ":80"
      caddy.reverse_proxy: "{{upstreams 80}}"

networks:
  caddy:
    external: true
