# Cloudflare Tunnel - exposes services to the Internet without opening ports.
# Optional stack. See Cloudflare docs for configuration.
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - .env
    networks:
      - caddy

networks:
  caddy:
    external: true
